services:
  mysqldb:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT:-demo}
      MYSQL_DATABASE: ${DATABASE:-demo}
      MYSQL_USER: ${DB_USER:-demo}
      MYSQL_PASSWORD: ${DB_PASSWORD:-demo}
    volumes:
      - demo-data:/var/lib/mysql

  caddy_proxy:
    image: caddy:latest
    ports:
      - 8080:80
      - 8443:443
    volumes:
      # Mount the host Caddyfile
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config

  frontend:
    image: m210-frontend:1.0
    build:
      context: ./frontend
      args:
        - VITE_API_URL=/api
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
    image: m210-backend:1.0
    depends_on:
      - mysqldb
    environment:
      MYSQL_HOST: mysqldb
      MYSQL_DATABASE: ${DATABASE:-demo}
      MYSQL_USER: ${DB_USER:-demo}
      MYSQL_PASSWORD: ${DB_PASSWORD:-demo}
      CORS_ALLOW: https://contacts.localhost:8443

volumes:
  demo-data:
  caddy_data:
  caddy_config:
