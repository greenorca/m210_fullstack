services:
  mysql-db:
    image: mysql:8.0
    ports:
      - 3306:3306
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT:-demo}
      MYSQL_DATABASE: ${DATABASE:-demo}
      MYSQL_USER: ${DB_USER:-demo}
      MYSQL_PASSWORD: ${DB_PASSWORD:-demo}
    
    volumes:
      - demo-data:/var/lib/mysql

  caddy-proxy:
    image: caddy:latest
    restart: always
    ports:
      - 8080:80
      - 8443:443
    volumes:
      # Mount the host Caddyfile
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config

  frontend:
    image: greenorca/m210-frontend:1.0-k8s
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    depends_on:
      - backend
    ports:
      - 80:80

  backend:
    build:
      context: ./backend
    image: greenorca/m210-backend:1.0
    depends_on:
      - mysqldb
    environment:
      MYSQL_HOST: mysqldb
      MYSQL_DATABASE: ${DATABASE:-demo}
      MYSQL_USER: ${DB_USER:-demo}
      MYSQL_PASSWORD: ${DB_PASSWORD:-demo}
      CORS_ALLOW: https://contacts.localhost:8443
    ports:
      - 8080:8080

volumes:
  demo-data:
  caddy_data:
  caddy_config:
