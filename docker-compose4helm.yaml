services:
  mysql-db:
    image: mysql:8.0
    ports:
      - 3306:3306 # keep to trigger K8S service discovery
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT:-demo}
      MYSQL_DATABASE: ${DATABASE:-demo}
      MYSQL_USER: ${DB_USER:-demo}
      MYSQL_PASSWORD: ${DB_PASSWORD:-demo}
    volumes:
      - db-data:/var/lib/mysql

  frontend:
    image: greenorca/m210-frontend:1.0-k8s
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    depends_on:
      - backend
    ports:
      - 80:80 # keep to trigger K8S service discovery

  backend:
    build:
      context: ./backend
    image: greenorca/m210-backend:1.0
    depends_on:
      - mysqldb
    environment:
      MYSQL_HOST: mysqldb
      MYSQL_DATABASE: ${DATABASE:-demo}
      MYSQL_USER: ${DB_USER:-demo}
      MYSQL_PASSWORD: ${DB_PASSWORD:-demo}
      CORS_ALLOW: https://contacts.localhost:8443
    ports:
      - 8080:8080 # keep to trigger K8S service discovery

volumes:
  db-data:
