apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: my-ingress
  namespace: default  

spec:
  rules:
  - host: m210.localhost  
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: backend  
            port:
              number: 8080  
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend  
            port:
              number: 80  
  ingressClassName: nginx