apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    io.kompose.service: backend
  name: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: backend
  template:
    metadata:
      labels:
        io.kompose.service: backend
    spec:
      containers:
        - env:
            - name: MYSQL_HOST
              value: mysql-db
            - name: MYSQL_DATABASE
              value: m210db
            - name: MYSQL_USER
              value: m210user
            - name: MYSQL_PASSWORD
              value: changeme
          image: greenorca/m210-backend:1.0
          name: backend
          ports:
            - containerPort: 8080
              protocol: TCP
      restartPolicy: Always
